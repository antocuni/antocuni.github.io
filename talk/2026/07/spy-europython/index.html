## Python is slow, TL;DR

* Everything is dynamic

  - The world can change at any time

* Compilers have a hard time

  - performance cliffs

  - unpredictable performance

  - optimization chasing

* ... but we like dynamicity

---

## Part 1: What is SPy?

<div class="fragment">

- Statically typed

- Safe, Fast

- Interpreted **and** compiled

- Low level **and** high level

- Variant

- Of Python

</div>

---

## Variant?

- TL;DR: you cannot be fast without breaking _some_ backward compatibility

- Source: I have tried for 20 years (and I'm not the only one)

- Stop rewriting in Rust/go/whatever, let's rewrite in SPy

---

## Statically typed, safe, fast

- Python typing it's an afterthought

- Not really safe

- Doesn't help with performance

- SPy type system designed from scratch for safety and performance

---

## Interpreted and compiled

- Python compilers usually (always?) diverges from CPython interp semantics

- SPy interp for development and debugging

  - `spdb`

- SPy compiler for speed

- Designed to give the exact same results

---

## Low level and high level

- **The two language problem**

- High level, easy, nice, slow

  - Python

- Low level, harder, fast

  - C / C++ / rust / cython / ...

- SPy: low level core, zero cost abstractions

---

## ... of Python

- SPy supports (with some twists):

  - Metaclasses

  - Decorators

  - Descriptor protocol

  - `__getattribute__`

  - dynamic dispatch (opt-in)

  - ...

- It _feels_ like Python

---

## Goals

- Easy to understand, easy to implement

- Predictable performance

- One language, two levels

- End users: no big difference

- Power users / library writers: you are at the right talk

### Non-goals

- 100% compatibility with CPython.

* Compiler

  - <span class="fragment" data-fragment-index="0">lowered</span> AST ➜ C ➜ `cc`

## Execution phases

* Import time

  - Statically resolve modules and imports

  - Everything is mutable "as usual"

  - Metaclasses, decorators, monkey-patching, ...

## Code specialization

```python title="make_adder.spy" autowrite
@blue
def make_adder(n):
	def impl(x: int) -> int:
		return x + n
	return impl

add5 = make_adder(5)
add7 = make_adder(7)

def main() -> None:
	print(add5(10))
	print(add7(20))
```

## Low-level core

- Northern star ⭐: implement builtins in `*.spy`:

  - `list`, `dict`, `str`, `tuple`, ...

- Plain user code, no special compiler support

- If you can write a fast `dict`, you can also write a fast `ndarray` or `DataFrame`

---

## Low-level SPy

<!-- .slide: style="--code-font-size: 0.8em; --code-max-height: 850px;" -->

```python
# stdlib/_list.spy (simplified)
from unsafe import gc_alloc, gc_ptr

@blue.generic
def list(T):

	@struct
	class ListData:
		length: i32
		capacity: i32
		items: gc_ptr[T]

	@struct
	class _ListImpl:
		__ll__: gc_ptr[ListData]

		def __new__() -> _ListImpl:
			data = gc_alloc[ListData](1)
			data.length = 0
			data.capacity = 4
			data.items = gc_alloc[T](4)
			return _ListImpl.__make__(data)

		def append(self, item: T) -> None:
			ll = self.__ll__
			if ll.length >= ll.capacity:
				old_capacity = ll.capacity
				new_capacity = old_capacity * 2
				new_items = gc_alloc[T](new_capacity)

				i = 0
				while i < ll.length:

## Metaprogramming (2)

<!-- .slide: style="--code-font-size: 0.8em; --code-max-height: 850px;" -->

```python
# stdlib/_tuple.spy

@blue.generic
def tuple(*items_T):

	@blue
	def get_fields():
		"""
		Return a dict like {
			"_item0": int,
			"_item1": int,
		}
		"""
		fields: dict[str, type] = {}
		for i in range(len(items_T)):
			fname = "_item" + str(i)
			T = items_T[i]
			fields[fname] = T
		return fields

	N = len(items_T)

	@struct
	class _tup:
		__extra_fields__ = get_fields()

		def __len__(self) -> i32:
			return N

```python
# stdlib/_tuple.spy

@blue.generic
def tuple(*items_T):
	@struct
	class _tup:
		@blue.metafunc
		def __getitem__(m_self, m_i):
			if m_i.color != "blue":
				raise TypeError("tuple index must be blue")

			# idx is blue so all the following lines are pre-evaluated at compile time
			i = m_i.blueval
			attr = "_item" + str(i)
			T = items_T[i]

			def get(self: _tup) -> T:
				# attr is blue, so this is equivalent to e.g. `self.item0`
				return getattr(self, attr)

			return OpSpec(get, [m_self])
